<!DOCTYPE html>
<html>
<head>
    <title>Gravity Zero</title>
    <style>
        body { margin: 0; background: #000; font-family: monospace; overflow: hidden; }
        #gameContainer { width: 100vw; height: 100vh; position: relative; }
        #ui {
            position: absolute; top: 30px; left: 30px; color: #00d4ff;
            font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
        }
        .stat { margin: 8px 0; display: flex; align-items: center; }
        .label { width: 60px; margin-right: 12px; font-size: 10px; }
        .bar {
            width: 120px; height: 4px; background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3); position: relative;
        }
        .bar-fill { height: 100%; transition: width 0.2s ease; }
        .shield-bar { background: linear-gradient(90deg, #0080ff, #00d4ff); }
        .hull-bar { background: linear-gradient(90deg, #ff4000, #ff6600); }
        .ammo-bar { background: linear-gradient(90deg, #ffaa00, #ffdd00); }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div class="stat">
                <div class="label">SHIELD</div>
                <div class="bar"><div class="bar-fill shield-bar" id="shieldBar" style="width: 100%"></div></div>
            </div>
            <div class="stat">
                <div class="label">HULL</div>
                <div class="bar"><div class="bar-fill hull-bar" id="hullBar" style="width: 100%"></div></div>
            </div>
            <div class="stat">
                <div class="label">AMMO</div>
                <div class="bar"><div class="bar-fill ammo-bar" id="ammoBar" style="width: 100%"></div></div>
            </div>
            <div class="stat">
                <div class="label">LAP</div>
                <div id="lapCounter" style="color: #00ffff; font-size: 14px;">1</div>
            </div>
        </div>
    </div>

    <script>
        class GravityZero {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.vehicle = null;
                this.enemies = [];
                this.bullets = [];
                this.vehiclePos = { x: 0, y: 3, z: 0 };
                this.vehicleRot = { x: 0, y: 0, z: 0 };
                this.velocity = { x: 0, y: 0, z: 0 };
                this.keys = {};
                this.stats = { shields: 100, hull: 100, ammo: 100 };
                this.gamepad = null;
                this.raceStarted = false;
                this.countdown = 3;
                this.lastShot = 0;
                this.lap = 1;
                this.checkpoints = [0, 0, 0, 0]; // 4 checkpoints
                this.lastCheckpoint = -1;
                
                this.init3D();
                this.setupInput();
                this.startCountdown();
                this.gameLoop();
                console.log('🚀 Gravity Zero 3D Combat Racing loaded');
            }

            startCountdown() {
                const countdownEl = document.createElement('div');
                countdownEl.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#00ffff;font-size:80px;font-family:monospace;z-index:1000;text-shadow:0 0 20px #00ffff';
                document.body.appendChild(countdownEl);
                
                const timer = setInterval(() => {
                    if (this.countdown > 0) {
                        countdownEl.textContent = this.countdown;
                        this.countdown--;
                    } else {
                        countdownEl.textContent = 'GO!';
                        setTimeout(() => {
                            this.raceStarted = true;
                            document.body.removeChild(countdownEl);
                        }, 500);
                        clearInterval(timer);
                    }
                }, 1000);
            }

            init3D() {
                // Create scene
                this.scene = this.createScene();
                this.camera = this.createCamera();
                this.renderer = this.createRenderer();
                
                // Add lighting
                this.addLighting();
                
                // Create world
                this.createTrack();
                this.createVehicle();
                this.createShieldStrips();
            }

            createScene() {
                return {
                    objects: [],
                    add: function(obj) { this.objects.push(obj); }
                };
            }

            createCamera() {
                return {
                    position: { x: 0, y: 8, z: 15 },
                    rotation: { x: -0.3, y: 0, z: 0 },
                    fov: 75
                };
            }

            createRenderer() {
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.style.display = 'block';
                document.getElementById('gameContainer').appendChild(canvas);
                
                const ctx = canvas.getContext('2d');
                return { canvas, ctx };
            }

            addLighting() {
                // Ambient lighting simulation
                this.ambientLight = 0.3;
                this.directionalLight = { x: 1, y: 1, z: 1, intensity: 0.7 };
            }

            createTrack() {
                // Oval racetrack
                this.trackPoints = [];
                for (let i = 0; i < 32; i++) {
                    const angle = (i / 32) * Math.PI * 2;
                    this.trackPoints.push({
                        x: Math.cos(angle) * 60,
                        z: Math.sin(angle) * 120
                    });
                }
                
                // Track surface
                this.track = {
                    type: 'oval',
                    points: this.trackPoints,
                    color: '#2a2a2a'
                };
                
                // Checkpoints (4 points around track)
                this.raceCheckpoints = [
                    { x: 60, z: 0, id: 0 },
                    { x: 0, z: 120, id: 1 },
                    { x: -60, z: 0, id: 2 },
                    { x: 0, z: -120, id: 3 }
                ];
                
                // Grid lines for track
                this.gridLines = [];
                for (let i = 0; i < this.trackPoints.length; i++) {
                    const p1 = this.trackPoints[i];
                    const p2 = this.trackPoints[(i + 1) % this.trackPoints.length];
                    this.gridLines.push({
                        type: 'line',
                        start: { x: p1.x - 20, y: 0.1, z: p1.z },
                        end: { x: p1.x + 20, y: 0.1, z: p1.z },
                        color: '#00ffff'
                    });
                }
            }

            createVehicle() {
                // Player vehicle
                this.vehicle = {
                    type: 'box',
                    position: this.vehiclePos,
                    rotation: this.vehicleRot,
                    size: { width: 4, height: 1, depth: 8 },
                    color: '#1a1a2e',
                    accent: '#00ffff'
                };
                this.scene.add(this.vehicle);
                
                // Enemy vehicles - lined up at start
                const startPositions = [
                    { x: -8, z: 0 }, { x: 8, z: 0 }, { x: -16, z: 0 }, { x: 16, z: 0 }
                ];
                
                startPositions.forEach((pos, i) => {
                    const enemy = {
                        type: 'box',
                        position: { x: pos.x, y: 3, z: pos.z },
                        rotation: { x: 0, y: 0, z: 0 },
                        velocity: { x: 0, y: 0, z: 0 },
                        size: { width: 4, height: 1, depth: 8 },
                        color: ['#2e1a1a', '#1a2e1a', '#2e2e1a', '#2e1a2e'][i],
                        accent: ['#ff4400', '#44ff00', '#ffff00', '#ff00ff'][i],
                        lastShot: 0,
                        target: null,
                        shields: 100,
                        hull: 100
                    };
                    this.enemies.push(enemy);
                });
            }

            createShieldStrips() {
                this.shieldStrips = [
                    { x: 40, z: 60 },
                    { x: -40, z: -60 },
                    { x: 0, z: 100 },
                    { x: 0, z: -100 }
                ].map(pos => ({
                    type: 'box',
                    position: { x: pos.x, y: 0.2, z: pos.z },
                    size: { width: 15, height: 0.4, depth: 30 },
                    color: '#ff0000'
                }));
            }

            setupInput() {
                document.addEventListener('keydown', (e) => this.keys[e.code] = true);
                document.addEventListener('keyup', (e) => this.keys[e.code] = false);
                window.addEventListener('gamepadconnected', (e) => {
                    this.gamepad = e.gamepad;
                    console.log('🎮 PS5 Controller connected - R1 to fire');
                });
            }

            update() {
                if (!this.raceStarted) return;
                
                // Get input
                let forward = this.keys['KeyW'] || this.keys['ArrowUp'];
                let backward = this.keys['KeyS'] || this.keys['ArrowDown'];
                let left = this.keys['KeyA'] || this.keys['ArrowLeft'];
                let right = this.keys['KeyD'] || this.keys['ArrowRight'];
                let fire = this.keys['Space'] || this.keys['KeyF'];
                
                // PS5 Controller
                if (this.gamepad) {
                    const gp = navigator.getGamepads()[this.gamepad.index];
                    if (gp) {
                        forward = forward || gp.buttons[7].value > 0.1; // R2
                        backward = backward || gp.buttons[6].value > 0.1; // L2
                        fire = fire || gp.buttons[5].pressed; // R1
                        const stickX = gp.axes[0];
                        if (Math.abs(stickX) > 0.2) {
                            if (stickX < 0) left = true;
                            if (stickX > 0) right = true;
                        }
                    }
                }

                // Player physics - improved controls
                const thrust = 0.4;
                const drag = 0.94;
                const turnSpeed = 0.04;
                const hoverForce = 0.8;

                // Anti-gravity hover
                if (this.vehiclePos.y < 3) {
                    this.velocity.y += hoverForce;
                }
                this.velocity.y -= 0.03; // gravity

                // Improved movement with proper forward direction
                const forwardX = Math.sin(this.vehicleRot.y);
                const forwardZ = -Math.cos(this.vehicleRot.y);
                
                if (forward) {
                    this.velocity.x += forwardX * thrust;
                    this.velocity.z += forwardZ * thrust;
                }
                if (backward) {
                    this.velocity.x -= forwardX * thrust * 0.6;
                    this.velocity.z -= forwardZ * thrust * 0.6;
                }
                
                // Turning only when moving
                const speed = Math.sqrt(this.velocity.x * this.velocity.x + this.velocity.z * this.velocity.z);
                const turnFactor = Math.min(speed * 0.3, 1);
                
                if (left) this.vehicleRot.y -= turnSpeed * turnFactor;
                if (right) this.vehicleRot.y += turnSpeed * turnFactor;

                // Player firing
                if (fire && Date.now() - this.lastShot > 150 && this.stats.ammo > 0) {
                    this.fireBullet(this.vehiclePos, this.vehicleRot.y, true);
                    this.stats.ammo = Math.max(0, this.stats.ammo - 2);
                    this.lastShot = Date.now();
                }

                // Apply drag and update position
                this.velocity.x *= drag;
                this.velocity.z *= drag;
                this.velocity.y *= 0.98;
                
                this.vehiclePos.x += this.velocity.x;
                this.vehiclePos.y += this.velocity.y;
                this.vehiclePos.z += this.velocity.z;

                // Ground collision
                if (this.vehiclePos.y < 2) {
                    this.vehiclePos.y = 2;
                    this.velocity.y = 0;
                }

                // Remove boundaries for oval track
                // this.vehiclePos.x = Math.max(-90, Math.min(90, this.vehiclePos.x));
                // this.vehiclePos.z = Math.max(-190, Math.min(190, this.vehiclePos.z));
                
                // Check lap progress
                this.checkLapProgress();

                // Update enemies
                this.updateEnemies();
                
                // Update bullets
                this.updateBullets();
                
                // Update camera
                this.updateCamera();
                
                // Check collisions
                this.checkCollisions();
                this.updateUI();
            }

            updateCamera() {
                // Static third-person camera - follows position only
                const distance = 20;
                const height = 10;
                
                // Camera stays behind vehicle but doesn't rotate with it
                const targetX = this.vehiclePos.x;
                const targetY = this.vehiclePos.y + height;
                const targetZ = this.vehiclePos.z + distance;
                
                // Smooth camera movement
                const lerpFactor = 0.1;
                this.camera.position.x += (targetX - this.camera.position.x) * lerpFactor;
                this.camera.position.y += (targetY - this.camera.position.y) * lerpFactor;
                this.camera.position.z += (targetZ - this.camera.position.z) * lerpFactor;
                
                // Camera always looks at vehicle center
                const dx = this.vehiclePos.x - this.camera.position.x;
                const dz = this.vehiclePos.z - this.camera.position.z;
                this.camera.rotation.y = Math.atan2(dx, dz);
                this.camera.rotation.x = -0.2; // Slight downward angle
            }

            checkCollisions() {
                this.shieldStrips.forEach(strip => {
                    const dx = this.vehiclePos.x - strip.position.x;
                    const dz = this.vehiclePos.z - strip.position.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    
                    if (distance < 10 && this.stats.shields < 100) {
                        this.stats.shields = Math.min(100, this.stats.shields + 0.5);
                    }
                });
                
                // Bullet collisions
                this.bullets.forEach((bullet, i) => {
                    if (bullet.isPlayer) {
                        // Player bullet vs enemies
                        this.enemies.forEach(enemy => {
                            const dx = bullet.position.x - enemy.position.x;
                            const dz = bullet.position.z - enemy.position.z;
                            if (Math.sqrt(dx*dx + dz*dz) < 3) {
                                this.bullets.splice(i, 1);
                                if (enemy.shields > 0) {
                                    enemy.shields -= 25;
                                } else {
                                    enemy.hull -= 25;
                                }
                            }
                        });
                    } else {
                        // Enemy bullet vs player
                        const dx = bullet.position.x - this.vehiclePos.x;
                        const dz = bullet.position.z - this.vehiclePos.z;
                        if (Math.sqrt(dx*dx + dz*dz) < 3) {
                            this.bullets.splice(i, 1);
                            if (this.stats.shields > 0) {
                                this.stats.shields -= 15;
                            } else {
                                this.stats.hull -= 15;
                            }
                        }
                    }
                });
            }

            updateEnemies() {
                this.enemies.forEach(enemy => {
                    if (enemy.hull <= 0) return;
                    
                    // Simple AI - move forward and occasionally turn
                    const thrust = 0.6;
                    const drag = 0.93;
                    
                    // Random steering
                    if (Math.random() < 0.02) {
                        enemy.rotation.y += (Math.random() - 0.5) * 0.1;
                    }
                    
                    // Move forward
                    enemy.velocity.x += Math.sin(enemy.rotation.y) * thrust;
                    enemy.velocity.z -= Math.cos(enemy.rotation.y) * thrust;
                    
                    // Hover physics
                    if (enemy.position.y < 3) enemy.velocity.y += 0.4;
                    enemy.velocity.y -= 0.02;
                    
                    // Apply drag
                    enemy.velocity.x *= drag;
                    enemy.velocity.z *= drag;
                    enemy.velocity.y *= 0.98;
                    
                    // Update position
                    enemy.position.x += enemy.velocity.x;
                    enemy.position.y += enemy.velocity.y;
                    enemy.position.z += enemy.velocity.z;
                    
                    // Ground collision
                    if (enemy.position.y < 2) {
                        enemy.position.y = 2;
                        enemy.velocity.y = 0;
                    }
                    
                    // Boundaries
                    enemy.position.x = Math.max(-90, Math.min(90, enemy.position.x));
                    enemy.position.z = Math.max(-190, Math.min(190, enemy.position.z));
                    
                    // Combat AI - shoot at player with imperfect aim
                    const dx = this.vehiclePos.x - enemy.position.x;
                    const dz = this.vehiclePos.z - enemy.position.z;
                    const distance = Math.sqrt(dx*dx + dz*dz);
                    
                    if (distance < 50 && Date.now() - enemy.lastShot > 800) {
                        // Trajectory prediction with error
                        const targetAngle = Math.atan2(dx, -dz);
                        const aimError = (Math.random() - 0.5) * 0.8; // Imperfect aim
                        this.fireBullet(enemy.position, targetAngle + aimError, false);
                        enemy.lastShot = Date.now();
                    }
                });
            }

            fireBullet(position, angle, isPlayer) {
                const speed = 3;
                this.bullets.push({
                    position: { x: position.x, y: position.y, z: position.z },
                    velocity: {
                        x: Math.sin(angle) * speed,
                        z: -Math.cos(angle) * speed
                    },
                    isPlayer: isPlayer,
                    life: 100
                });
            }

            updateBullets() {
                this.bullets.forEach((bullet, i) => {
                    bullet.position.x += bullet.velocity.x;
                    bullet.position.z += bullet.velocity.z;
                    bullet.life--;
                    
                    if (bullet.life <= 0) {
                        this.bullets.splice(i, 1);
                    }
                });
            }

            render() {
                const ctx = this.renderer.ctx;
                const canvas = this.renderer.canvas;
                
                // Clear screen
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Simple 3D projection
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const focalLength = 400;
                
                // Render track grid
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                this.gridLines.forEach(line => {
                    const start = this.project3D(line.start, centerX, centerY, focalLength);
                    const end = this.project3D(line.end, centerX, centerY, focalLength);
                    
                    if (start && end) {
                        ctx.beginPath();
                        ctx.moveTo(start.x, start.y);
                        ctx.lineTo(end.x, end.y);
                        ctx.stroke();
                    }
                });
                
                // Render shield strips
                ctx.fillStyle = '#ff0000';
                this.shieldStrips.forEach(strip => {
                    const projected = this.project3D(strip.position, centerX, centerY, focalLength);
                    if (projected) {
                        const size = 800 / projected.z;
                        ctx.fillRect(projected.x - size/2, projected.y - size/4, size, size/2);
                    }
                });
                
                // Render vehicle
                const vehicleProj = this.project3D(this.vehiclePos, centerX, centerY, focalLength);
                if (vehicleProj) {
                    const size = 1000 / vehicleProj.z;
                    
                    ctx.save();
                    ctx.translate(vehicleProj.x, vehicleProj.y);
                    ctx.rotate(this.vehicleRot.y);
                    
                    // Vehicle body
                    ctx.fillStyle = '#1a1a2e';
                    ctx.fillRect(-size/2, -size, size, size*2);
                    
                    // Neon accent
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-size/2, -size, size, size*2);
                    
                    ctx.restore();
                }
                
                // Render enemies
                this.enemies.forEach(enemy => {
                    if (enemy.hull <= 0) return;
                    
                    const enemyProj = this.project3D(enemy.position, centerX, centerY, focalLength);
                    if (enemyProj) {
                        const size = 1000 / enemyProj.z;
                        
                        ctx.save();
                        ctx.translate(enemyProj.x, enemyProj.y);
                        ctx.rotate(enemy.rotation.y);
                        
                        // Enemy body
                        ctx.fillStyle = enemy.color;
                        ctx.fillRect(-size/2, -size, size, size*2);
                        
                        // Enemy accent
                        ctx.strokeStyle = enemy.accent;
                        ctx.lineWidth = 2;
                        ctx.strokeRect(-size/2, -size, size, size*2);
                        
                        ctx.restore();
                    }
                });
                
                // Render bullets
                ctx.fillStyle = '#ffff00';
                this.bullets.forEach(bullet => {
                    const bulletProj = this.project3D(bullet.position, centerX, centerY, focalLength);
                    if (bulletProj) {
                        const size = 200 / bulletProj.z;
                        ctx.fillRect(bulletProj.x - size/2, bulletProj.y - size/2, size, size);
                    }
                });
            }

            project3D(pos, centerX, centerY, focalLength) {
                // Transform relative to camera
                const relX = pos.x - this.camera.position.x;
                const relY = pos.y - this.camera.position.y;
                const relZ = pos.z - this.camera.position.z;
                
                // Simple camera rotation
                const cosY = Math.cos(-this.camera.rotation.y);
                const sinY = Math.sin(-this.camera.rotation.y);
                
                const rotX = relX * cosY - relZ * sinY;
                const rotZ = relX * sinY + relZ * cosY;
                
                if (rotZ <= 0) return null; // Behind camera
                
                return {
                    x: centerX + (rotX * focalLength) / rotZ,
                    y: centerY - (relY * focalLength) / rotZ,
                    z: rotZ
                };
            }

            updateUI() {
                document.getElementById('shieldBar').style.width = this.stats.shields + '%';
                document.getElementById('hullBar').style.width = this.stats.hull + '%';
                document.getElementById('ammoBar').style.width = this.stats.ammo + '%';
                document.getElementById('lapCounter').textContent = this.lap;
            }

            checkLapProgress() {
                // Check checkpoint progression
                this.raceCheckpoints.forEach(checkpoint => {
                    const dx = this.vehiclePos.x - checkpoint.x;
                    const dz = this.vehiclePos.z - checkpoint.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    
                    if (distance < 25) {
                        const expectedNext = (this.lastCheckpoint + 1) % 4;
                        if (checkpoint.id === expectedNext) {
                            this.checkpoints[checkpoint.id] = 1;
                            this.lastCheckpoint = checkpoint.id;
                            
                            // Check if lap completed
                            if (this.checkpoints.every(c => c === 1)) {
                                this.lap++;
                                this.checkpoints = [0, 0, 0, 0];
                                this.lastCheckpoint = -1;
                                console.log(`Lap ${this.lap} started!`);
                            }
                        }
                    }
                });
            }

            gameLoop() {
                this.update();
                this.render();
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        new GravityZero();
    </script>
</body>
</html>
