<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Zero</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: 'Consolas', 'Monaco', monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #00d4ff;
            z-index: 100;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .stat {
            margin: 8px 0;
            display: flex;
            align-items: center;
            opacity: 0.9;
        }
        .label {
            width: 60px;
            margin-right: 12px;
            font-size: 10px;
        }
        .bar {
            width: 120px;
            height: 4px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.2s ease;
            position: relative;
        }
        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
            animation: sweep 2s infinite;
        }
        .shield-bar { background: linear-gradient(90deg, #0080ff, #00d4ff); }
        .hull-bar { background: linear-gradient(90deg, #ff4000, #ff6600); }
        .ammo-bar { background: linear-gradient(90deg, #ffaa00, #ffdd00); }
        @keyframes sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div class="stat">
                <div class="label">SHIELD</div>
                <div class="bar"><div class="bar-fill shield-bar" style="width: 100%"></div></div>
            </div>
            <div class="stat">
                <div class="label">HULL</div>
                <div class="bar"><div class="bar-fill hull-bar" style="width: 100%"></div></div>
            </div>
            <div class="stat">
                <div class="label">AMMO</div>
                <div class="bar"><div class="bar-fill ammo-bar" style="width: 100%"></div></div>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r158/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.20.0/cannon.min.js"></script>
    <script src="src/game.js"></script>
</body>
</html>
